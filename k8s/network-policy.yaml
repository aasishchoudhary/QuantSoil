apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: runtime-default-deny
  namespace: gods-eye
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: runtime-egress
  namespace: gods-eye
spec:
  podSelector:
    matchLabels:
      app: world-intelligence-runtime
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 443
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: runtime-ingress
  namespace: gods-eye
spec:
  podSelector:
    matchLabels:
      app: world-intelligence-runtime
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: gods-eye-web
      ports:
        - protocol: TCP
          port: 8080
