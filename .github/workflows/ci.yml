name: ci
on: [push, pull_request]

jobs:
  integrity:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[test]"
      - name: Validate all JSON schemas
        run: |
          set -euo pipefail
          for schema in schemas/*.json; do
            python -m json.tool "$schema" >/dev/null
          done
      - name: Validate Python sources
        run: python -m compileall -q packages services tests

      - name: Validate Kubernetes manifests
        run: python -c 'import pathlib, yaml; list(yaml.safe_load_all(pathlib.Path("k8s/runtime.yaml").read_text()))'

      - name: Run unit tests
        run: python -m pytest -q
