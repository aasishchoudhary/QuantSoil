name: ci
on: [push, pull_request]

jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[test]"
      - name: Validate schemas
        run: python -m json.tool schemas/observation.schema.json >/dev/null && python -m json.tool schemas/entity.schema.json >/dev/null && python -m json.tool schemas/map-feature.schema.json >/dev/null
      - name: Run unit tests
        run: python -m pytest -q
