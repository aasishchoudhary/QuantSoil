name: Autonomous Engineering

on:
  push:
    branches: [main]
  schedule:
    - cron: "2/5 * * * *"
  workflow_dispatch:

concurrency:
  group: gods-eye-autonomous-engineering
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  engineer:
    name: Bounded autonomous implementation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout main
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Configure Git identity
        run: |
          git config user.name "God's Eye Autonomous Engineer"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Check autonomous queue gate
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          count="$(gh pr list --state open --json headRefName --jq '[.[] | select(.headRefName | startswith("autonomous/"))] | length')"
          if [ "$count" -gt 0 ]; then
            echo "An autonomous PR is already open; waiting for review/merge."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          else
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify AWS role configuration before authentication
        if: steps.gate.outputs.proceed == 'true'
        env:
          AWS_ROLE_ARN: ${{ vars.GODS_EYE_AWS_ROLE_ARN }}
        run: |
          if [ -z "$AWS_ROLE_ARN" ]; then
            echo "::error::Repository variable GODS_EYE_AWS_ROLE_ARN is missing. Configure the GitHub repository variable before enabling autonomous Bedrock execution."
            exit 1
          fi
          case "$AWS_ROLE_ARN" in
            arn:aws:iam::*:role/*) ;;
            *) echo "::error::GODS_EYE_AWS_ROLE_ARN is not a valid IAM role ARN."; exit 1 ;;
          esac

      - name: Configure AWS credentials through OIDC
        if: steps.gate.outputs.proceed == 'true'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.GODS_EYE_AWS_ROLE_ARN }}
          aws-region: ap-south-1
          role-session-name: gods-eye-${{ github.run_id }}

      - name: Select authorized Bedrock inference profile
        if: steps.gate.outputs.proceed == 'true'
        id: model
        env:
          AWS_REGION: ap-south-1
        run: |
          aws sts get-caller-identity
          python - <<'PY' > /tmp/model.txt
          import json, os, subprocess, sys

          region = os.environ["AWS_REGION"]
          preferred = {
              "apac.amazon.nova-lite-v1:0",
              "apac.amazon.nova-micro-v1:0",
          }

          p = subprocess.run(
              ["aws", "bedrock", "list-inference-profiles",
               "--region", region, "--type-equals", "SYSTEM_DEFINED",
               "--output", "json", "--no-cli-pager"],
              text=True, capture_output=True, check=False,
          )
          if p.returncode != 0:
              print(p.stderr.strip(), file=sys.stderr)
              raise SystemExit("Unable to discover Bedrock inference profiles")

          data = json.loads(p.stdout)
          active = {
              item.get("inferenceProfileId")
              for item in data.get("inferenceProfileSummaries", [])
              if item.get("status") == "ACTIVE"
          }
          for model_id in sorted(preferred):
              if model_id in active:
                  print(model_id)
                  raise SystemExit(0)
          raise SystemExit(
              "No ACTIVE APAC Nova Lite/Micro system-defined inference profile "
              "is available in ap-south-1"
          )
          PY
          echo "model_id=$(cat /tmp/model.txt)" >> "$GITHUB_OUTPUT"
          echo "Selected authorized Bedrock inference profile: $(cat /tmp/model.txt)"
      - name: Install autonomy dependencies
        if: steps.gate.outputs.proceed == 'true'
        run: python -m pip install --upgrade pip && python -m pip install -e ".[test,autonomy]"

      - name: Select next unmerged bounded task
        if: steps.gate.outputs.proceed == 'true'
        id: task
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY' > /tmp/task.json
          import json
          import subprocess

          tasks = json.load(open("scripts/autonomy/tasks.json", encoding="utf-8"))["tasks"]

          def gh_json(args):
              result = subprocess.run(
                  ["gh", *args],
                  text=True,
                  capture_output=True,
                  check=True,
              )
              return json.loads(result.stdout)

          open_prs = gh_json([
              "pr", "list", "--state", "open", "--limit", "100",
              "--json", "number,title,body,headRefName"
          ])
          merged_prs = gh_json([
              "pr", "list", "--state", "merged", "--limit", "100",
              "--json", "number,title,body,headRefName"
          ])

          def task_already_tracked(task):
              task_id = task["id"].lower()
              title = f'feat(autonomy): advance {task["id"]}'.lower()
              for pr in open_prs + merged_prs:
                  haystack = " ".join([
                      pr.get("title", ""),
                      pr.get("body", "") or "",
                      pr.get("headRefName", ""),
                  ]).lower()
                  if title in haystack or task_id in haystack:
                      return True
              return False

          for task in sorted(tasks, key=lambda x: x["priority"]):
              if not task_already_tracked(task):
                  print(json.dumps(task))
                  break
          else:
              print(json.dumps({
                  "id": "backlog-discovery",
                  "goal": (
                      "Inspect the repository against AGENTS.md and EVALUATION_POLICY.md. "
                      "Select one missing production-critical implementation slice, implement "
                      "it with tests, and document the evidence. Do not modify policy or workflow files."
                  ),
              }))
          PY
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          task=json.load(open("/tmp/task.json",encoding="utf-8"))
          print("task<<EOF")
          print(task["goal"])
          print("EOF")
          print("id="+task["id"])
          PY

      - name: Create isolated branch
        if: steps.gate.outputs.proceed == 'true'
        env:
          TASK_ID: ${{ steps.task.outputs.id }}
        run: git switch -c "autonomous/${TASK_ID}-${{ github.run_id }}"

      - name: Run bounded agent
        if: steps.gate.outputs.proceed == 'true'
        env:
          GODS_EYE_TASK: ${{ steps.task.outputs.task }}
          GODS_EYE_MODEL_ID: ${{ steps.model.outputs.model_id }}
          AWS_REGION: ap-south-1
        run: python scripts/autonomy/agent.py

      - name: Validate autonomous change scope
        if: steps.gate.outputs.proceed == 'true'
        run: python scripts/autonomy/validate_change.py

      - name: Validate and inspect changes
        if: steps.gate.outputs.proceed == 'true'
        run: |
          python -m pytest -q
          git diff --check
          git status --short
          test -n "$(git status --porcelain)"

      - name: Commit and push isolated branch
        if: steps.gate.outputs.proceed == 'true'
        env:
          TASK_ID: ${{ steps.task.outputs.id }}
        run: |
          git add packages services connectors schemas tests docs db scripts pyproject.toml
          git diff --cached --check
          git commit -m "feat(autonomy): advance $TASK_ID"
          git push --set-upstream origin "autonomous/$TASK_ID-${{ github.run_id }}"

      - name: Open pull request
        if: steps.gate.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TASK_ID: ${{ steps.task.outputs.id }}
        run: |
          gh pr create             --base main             --head "autonomous/$TASK_ID-${{ github.run_id }}"             --title "feat(autonomy): advance $TASK_ID"             --body "Autonomous bounded implementation task: $TASK_ID. Generated on an isolated branch; deterministic tests and diff checks passed. Human and architectural review remains required before merge."
