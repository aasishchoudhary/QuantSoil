[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "gods-eye-world-intelligence"
version = "0.1.0"
description = "Evidence-first lawful OSINT/GEOINT world intelligence platform"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
test = ["pytest>=8"]
autonomy = ["boto3>=1.40,<2"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["packages*", "services*"]
exclude = ["db*", "schemas*", "connectors*"]
